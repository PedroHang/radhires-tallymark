[project]
name = "tallymark"
version = "1.0.0"
description = "Finds drawing requirements no Bill of Characteristics row accounts for."
requires-python = ">=3.12,<3.13"
# Runtime dependencies only: this is what a Vercel deployment installs (see docs/DEPLOY.md).
# Keep in step with requirements.txt (tests/test_deploy.py checks it).
dependencies = [
    "anthropic==1.6.0",
    "google-genai==2.31.0",
    "fastapi==0.141.1",
    "numpy==2.5.3",
    "openai==3.35.1",
    "onnxruntime==1.30.0",
    "opencv-python-headless==5.0.0.93",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "pymupdf==1.28.2",
    "python-multipart==0.0.32",
    "RapidFuzz==3.14.6",
    "rapidocr-onnxruntime==1.4.4",
    "vercel-blob==0.5.0",
]

[dependency-groups]
# local server and tests; Vercel runs the ASGI app itself and does not need these
dev = [
    "uvicorn[standard]==0.53.0",
    "pytest==9.1.1",
]

[tool.uv]
# rapidocr-onnxruntime declares the GUI build of OpenCV (opencv-python, ~190 MB unpacked).
# opencv-python-headless provides the same cv2 module without the GUI libraries, so the GUI
# build is overridden away to keep the serverless bundle under its size limit.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.vercel]
entrypoint = "app.main:app"
